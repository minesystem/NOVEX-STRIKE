<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <meta name="theme-color" content="#050505">

  <title>NØV3X STRIKE</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- =========================
       MAIN MENU
  ========================== -->

  <div id="menu">

    <div class="logo">NØV3X</div>

    <div class="subtitle">STRIKE</div>

    <div class="gameType">
      MOBILE FPS
    </div>

    <button id="playBtn">
      DEPLOY
    </button>

  </div>


  <!-- =========================
       GAME
  ========================== -->

  <div id="game" class="hidden">

    <!-- Battlefield -->
    <!-- Created by map.js -->


    <!-- Damage overlay -->

    <div id="damageOverlay"></div>


    <!-- =========================
         HUD
    ========================== -->

    <div id="hud">

      <div class="hudLeft">

        <div class="healthBox">
          ❤️
          <span id="health">100</span>
        </div>

        <div class="armorBox">
          🛡️
          <span id="armor">100</span>
        </div>

      </div>


      <div class="scoreBox">

        SCORE

        <span id="score">
          0
        </span>

      </div>


      <div class="ammoBox">

        <span id="ammo">
          30
        </span>

        <small>
          /30
        </small>

      </div>

    </div>


    <!-- =========================
         MISSION
    ========================== -->

    <div id="mission">

      <span>
        MISSION
      </span>

      <strong>
        ELIMINATE HOSTILES
      </strong>

    </div>


    <!-- =========================
         CROSSHAIR
    ========================== -->

    <div id="crosshair">

      <span class="crossTop"></span>

      <span class="crossBottom"></span>

      <span class="crossLeft"></span>

      <span class="crossRight"></span>

      <div class="crossDot"></div>

    </div>


    <!-- =========================
         LEGACY ENEMY
         Kept for compatibility
    ========================== -->

    <div id="enemy">

      <div class="enemyHead"></div>

      <div class="enemyBody"></div>

      <div class="enemyWeapon"></div>

    </div>


    <!-- =========================
         HIT MARKER
    ========================== -->

    <div id="hitMarker">

      <span></span>
      <span></span>
      <span></span>
      <span></span>

    </div>


    <!-- =========================
         MUZZLE FLASH
    ========================== -->

    <div id="muzzleFlash"></div>


    <!-- =========================
         WEAPON
    ========================== -->

    <div id="weapon">

      <div class="weaponBody"></div>

      <div class="weaponMagazine"></div>

      <div class="weaponBarrel"></div>

      <div class="weaponGrip"></div>

    </div>


    <!-- =========================
         GAME MESSAGE
    ========================== -->

    <div id="message"></div>


    <!-- =========================
         MOBILE CONTROLS
    ========================== -->

    <div id="controls">


      <!-- Movement -->

      <div id="joystick">

        <div id="stick"></div>

      </div>


      <!-- Actions -->

      <div id="actionButtons">

        <button
          id="reloadBtn"
          type="button"
          aria-label="Reload"
        >
          ↻
        </button>


        <button
          id="shootBtn"
          type="button"
          aria-label="Fire"
        >
          FIRE
        </button>

      </div>

    </div>

  </div>


  <!-- =========================
       JAVASCRIPT
  ========================== -->

  <script src="game.js"></script>

  <script src="map.js"></script>

  <script src="enemies.js"></script>

</body>

</html>
