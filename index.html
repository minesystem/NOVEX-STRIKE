<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <meta name="theme-color" content="#050505">

  <title>NØV3X STRIKE</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- =========================
       MENU
  ========================== -->

  <div id="menu">

    <div class="logo">NØV3X</div>

    <div class="subtitle">STRIKE</div>

    <div class="gameType">
      MOBILE FPS
    </div>

    <button id="playBtn">
      DEPLOY
    </button>

  </div>


  <!-- =========================
       GAME
  ========================== -->

  <div id="game" class="hidden">

    <div id="damageOverlay"></div>


    <!-- HUD -->

    <div id="hud">

      <div class="hudLeft">

        <div class="healthBox">
          ❤️ <span id="health">100</span>
        </div>

        <div class="armorBox">
          🛡️ <span id="armor">100</span>
        </div>

      </div>


      <div class="scoreBox">

        SCORE

        <span id="score">0</span>

      </div>


      <div class="ammoBox">

        <span id="ammo">30</span>

        <small id="maxAmmo">
          /30
        </small>

      </div>

    </div>


    <!-- WEAPON NAME -->

    <div id="weaponInfo">

      <span>PRIMARY</span>

      <strong id="weaponName">
        VX-AR
      </strong>

    </div>


    <!-- MISSION -->

    <div id="mission">

      <span>MISSION</span>

      <strong>
        ELIMINATE HOSTILES
      </strong>

    </div>


    <!-- CROSSHAIR -->

    <div id="crosshair">

      <span class="crossTop"></span>
      <span class="crossBottom"></span>
      <span class="crossLeft"></span>
      <span class="crossRight"></span>

      <div class="crossDot"></div>

    </div>


    <!-- HIT MARKER -->

    <div id="hitMarker">

      <span></span>
      <span></span>
      <span></span>
      <span></span>

    </div>


    <!-- MUZZLE -->

    <div id="muzzleFlash"></div>


    <!-- WEAPON -->

    <div id="weapon">

      <div class="weaponBody"></div>

      <div class="weaponMagazine"></div>

      <div class="weaponBarrel"></div>

      <div class="weaponGrip"></div>

    </div>


    <!-- MESSAGE -->

    <div id="message"></div>


    <!-- WEAPON SELECTOR -->

    <div id="weaponSelector">

      <button
        class="weaponBtn active"
        data-weapon="0"
      >
        AR
      </button>

      <button
        class="weaponBtn"
        data-weapon="1"
      >
        SMG
      </button>

      <button
        class="weaponBtn"
        data-weapon="2"
      >
        DMR
      </button>

    </div>


    <!-- CONTROLS -->

    <div id="controls">

      <div id="joystick">

        <div id="stick"></div>

      </div>


      <div id="actionButtons">

        <button
          id="reloadBtn"
          type="button"
        >
          ↻
        </button>

        <button
          id="shootBtn"
          type="button"
        >
          FIRE
        </button>

      </div>

    </div>

  </div>


  <!-- SCRIPTS -->

  <script src="game.js"></script>

  <script src="map.js"></script>

  <script src="enemies.js"></script>

</body>

</html>
